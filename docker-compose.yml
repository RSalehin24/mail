# One project for both containers: the dashboard runs the Maddy account commands itself (no Docker
# access, no root helper), so Maddy and the dashboard run as the same user and share its data.
x-maddy-runtime-tmpfs: &maddy-runtime-tmpfs
  "/run/maddy:size=1048576,mode=0700,uid=${MAIL_ADMIN_UID:?Set service UID},gid=${MAIL_ADMIN_GID:?Set service GID}"

services:
  maddy:
    image: ghcr.io/foxcpp/maddy@sha256:e1074e92a452b84d1135ebe8ab831c5f541d33dcbd39e38fab740a53bbf2f97c
    pull_policy: never
    platform: linux/amd64
    container_name: maddy
    user: "${MAIL_ADMIN_UID:?Set service UID}:${MAIL_ADMIN_GID:?Set service GID}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
    entrypoint: [/usr/local/libexec/mail-admin-maddy, -config, /data/maddy.conf]
    command: [run]
    environment:
      MADDY_DOMAIN: rsalehin24.me
      MADDY_HOSTNAME: mail.rsalehin24.me
    ports: ["25:25", "993:993", "587:587"]
    tmpfs: [*maddy-runtime-tmpfs]
    volumes:
      - type: bind
        source: /opt/maddy/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: /opt/maddy/config/maddy.conf
        target: /data/maddy.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MAIL_ADMIN_TLS_DIRECTORY:?Set validated immutable certificate generation}
        target: /data/tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /usr/local/libexec/mail-admin-maddy
        target: /usr/local/libexec/mail-admin-maddy
        read_only: true
        bind: {create_host_path: false}

  mail-admin:
    image: ${MAIL_ADMIN_IMAGE:?Set tested runtime image}
    pull_policy: never
    platform: linux/amd64
    container_name: mail-admin
    user: "${MAIL_ADMIN_UID:?Set service UID}:${MAIL_ADMIN_GID:?Set service GID}"
    mem_limit: ${MAIL_ADMIN_MEMORY_LIMIT:?Set measured memory limit}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    ports: ["443:8443"]
    volumes:
      # The dashboard's own database.
      - type: bind
        source: ./data
        target: /app/data
        bind: {create_host_path: false}
      # The certificate generation the dashboard serves HTTPS with.
      - type: bind
        source: ${MAIL_ADMIN_TLS_DIRECTORY:?Set validated immutable certificate generation}
        target: /tls
        read_only: true
        bind: {create_host_path: false}
      # Maddy's data: the Maddy CLI the dashboard runs creates and removes mailboxes here.
      - type: bind
        source: /opt/maddy/data
        target: /data
        bind: {create_host_path: false}
      # The Maddy CLI parses this config; never replaced by a worker, so a file mount is safe.
      - type: bind
        source: /opt/maddy/config/maddy.conf
        target: /data/maddy.conf
        read_only: true
        bind: {create_host_path: false}
      # The CLI loads the certificate files the config names.
      - type: bind
        source: ${MAIL_ADMIN_TLS_DIRECTORY:?Set validated immutable certificate generation}
        target: /data/tls
        read_only: true
        bind: {create_host_path: false}
      # Journal, queues and recovery records, shared with the root workers (a directory, so replaced files stay visible).
      - type: bind
        source: /var/lib/mail-admin-helper
        target: /var/lib/mail-admin-helper
        bind: {create_host_path: false}
      # The lock the root workers also take; recreated by tmpfiles before start, never replaced.
      - type: bind
        source: /run/lock/mail-admin-maddy.lock
        target: /run/lock/mail-admin-maddy.lock
        bind: {create_host_path: false}
      # deployment.json (status thresholds, deletion switch) and helper-policy.json; a directory because tools rewrite them atomically.
      - type: bind
        source: /etc/mail-admin
        target: /run/mail-admin-host/etc
        read_only: true
        bind: {create_host_path: false}
      # manifest.json for the Server page's backup tile and the deletion guard; rewritten atomically.
      - type: bind
        source: /var/lib/mail-admin-backup
        target: /var/lib/mail-admin-backup
        read_only: true
        bind: {create_host_path: false}
      # Monitor and served-certificate observations the root monitors rewrite.
      - type: bind
        source: /var/lib/mail-admin-alerts
        target: /var/lib/mail-admin-alerts
        read_only: true
        bind: {create_host_path: false}
      # state.json written by certificate renewal.
      - type: bind
        source: /var/lib/mail-admin-certificates
        target: /var/lib/mail-admin-certificates
        read_only: true
        bind: {create_host_path: false}
      # Application keys.
      - type: bind
        source: /etc/mail-admin/secrets
        target: /run/secrets/mail-admin
        read_only: true
        bind: {create_host_path: false}
      # Installation marker; written once at provisioning.
      - type: bind
        source: /etc/mail-admin/installation.json
        target: /run/mail-admin-installation.json
        read_only: true
        bind: {create_host_path: false}
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: ${MAIL_ADMIN_TMPFS_LIMIT:?Set measured temporary filesystem limit}
          mode: 01777
    tmpfs: [*maddy-runtime-tmpfs]
    environment:
      HASH_MEMORY_KIB: ${MAIL_ADMIN_HASH_MEMORY_KIB:?Set measured hash memory}
      HASH_PARALLELISM: ${MAIL_ADMIN_HASH_PARALLELISM:?Set measured hash concurrency}
      HTTP_CONCURRENCY: ${MAIL_ADMIN_HTTP_CONCURRENCY:?Set measured HTTP concurrency}
      OPERATION_TIMEOUT_SECONDS: ${MAIL_ADMIN_OPERATION_TIMEOUT_SECONDS:?Set bounded deadline}
      EMAIL_OTP_ENABLED: ${MAIL_ADMIN_EMAIL_OTP_ENABLED:-false}
      PERMANENT_DELETION_ENABLED: ${MAIL_ADMIN_PERMANENT_DELETION_ENABLED:-false}
