[project]
name = "mail-admin"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "helper", "host", "shared"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "qrcode.*"]
ignore_missing_imports = true
